version: '3.8'
services:
mongodb:
  image: mongo:7
  container_name: mongodb
  ports:
    - "27017:27017"
  volumes:
    - mongo-data:/data/db
backend:
  build: ./backend
  container_name: backend
  ports:
    - "5001:5001"
  environment:
    - PORT=5001
    - MONGO_URI=mongodb://mongodb:27017/mern-app
  depends_on:
    - mongodb
frontend:
  build: ./frontend
  container_name: frontend
  ports:
    - "5173:5173"
  depends_on:
    - backend
volumes:
  mongo-data: